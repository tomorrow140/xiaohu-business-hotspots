name: Collect business hotspots

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "采集完成后更新网页数据"
        required: true
        type: boolean
        default: true
  schedule:
    # Every day at 09:00 China Standard Time.
    - cron: "0 1 * * *"

permissions:
  contents: write
  models: read

concurrency:
  group: collect-business-hotspots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect recent media news
        run: |
          mkdir -p data/hotspots
          python automation/collect_business_hotspots.py \
            --days 15 \
            --limit 40
          DIRECT_RAW=$(ls -t data/hotspots/*-raw-items.json | head -1)
          python automation/collect_free_news.py \
            --base "$DIRECT_RAW" \
            --days 15 \
            --output data/hotspots/cloud-raw-items.json
          python automation/collect_business_hotspots.py \
            --raw-items data/hotspots/cloud-raw-items.json \
            --days 15 \
            --limit 40

          VIDEO_SOURCES=""
          if [ -f data/video_sources.csv ]; then
            VIDEO_SOURCES="--video-sources data/video_sources.csv"
          fi
          if [ -n "$VIDEO_SOURCES" ]; then
            python automation/collect_business_hotspots.py \
              --raw-items data/hotspots/cloud-raw-items.json \
              $VIDEO_SOURCES \
              --days 15 \
              --limit 40
          fi

      - name: Add AI topic-value analysis
        env:
          GITHUB_TOKEN: $${{ github.token }}
        run: |
          python automation/enrich_topic_values.py \
            --input insights/hotspots-data.js \
            --limit-per-industry 5

      - name: Publish refreshed hotspot data
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          ACTUAL_COUNT=$(python -c 'import json,pathlib; text=pathlib.Path("insights/hotspots-data.js").read_text(encoding="utf-8"); payload=json.loads(text.removeprefix("window.XIAOHU_HOTSPOTS_DATA = ").rstrip(" ;\n")); print(len(payload.get("hotspots", [])))')
          if [ "$ACTUAL_COUNT" -lt 3 ]; then
            echo "Quality gate failed: only $ACTUAL_COUNT hotspots generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/hotspots-data.js
          if git diff --cached --quiet; then
            echo "No hotspot data changes."
          else
            git commit -m "Refresh business hotspots"
            git push
          fi
