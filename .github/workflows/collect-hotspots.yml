name: Collect business hotspots

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "采集完成后更新网页数据"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

concurrency:
  group: collect-business-hotspots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect recent media news
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          mkdir -p data/hotspots
          if [ -n "$TAVILY_API_KEY" ]; then
            python automation/collect_tavily_news.py \
              --days 15 \
              --output data/hotspots/cloud-raw-items.json
            python automation/collect_business_hotspots.py \
              --raw-items data/hotspots/cloud-raw-items.json \
              --days 15 \
              --limit 40
          else
            echo "TAVILY_API_KEY is not configured; falling back to direct media collection."
            python automation/collect_business_hotspots.py \
              --days 15 \
              --limit 40
          fi

      - name: Publish refreshed hotspot data
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/hotspots-data.js
          if git diff --cached --quiet; then
            echo "No hotspot data changes."
          else
            git commit -m "Refresh business hotspots"
            git push
          fi
